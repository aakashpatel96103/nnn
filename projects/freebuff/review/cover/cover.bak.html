<!doctype html>
<html><head><meta charset="utf-8"><title>cover</title>
<style>
:root{
  --bg:#F6F3EE; --ink:#141414; --mute:#8a857c; --clay:#D97757; --clayD:#B85A3A;
  --green:#22A35A; --line:#E4DED3; --hl:#FFD9C7;
  --sans:"Segoe UI", Arial, sans-serif; --serif:Georgia, "Times New Roman", serif; --mono:"Cascadia Mono", Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);position:relative}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(20,20,20,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(20,20,20,.045) 1px,transparent 1px);background-size:54px 54px}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 42%,rgba(0,0,0,0) 55%,rgba(70,35,15,.10) 100%)}

.kick{position:absolute;left:0;width:1080px;top:258px;text-align:center;font:600 23px var(--mono);letter-spacing:3px;color:var(--mute)}
.head{position:absolute;left:0;width:1080px;top:312px;text-align:center;font-weight:800;letter-spacing:-4px;line-height:1.02}
.head .l{display:block;font-size:128px}
.head i{display:block;font-family:var(--serif);font-style:italic;font-weight:400;color:var(--clay);letter-spacing:-3px;font-size:122px;line-height:1.08;margin-top:6px}
.hl{position:relative;display:inline-block;z-index:0}
.hl::before{content:"";position:absolute;left:-14px;right:-14px;bottom:8px;height:36%;background:var(--hl);z-index:-1;border-radius:8px}

.card{position:absolute;left:90px;top:750px;width:900px;height:492px;background:#1E1E1D;border:2px solid #000;border-radius:30px;color:#EDEDED;box-shadow:0 34px 80px rgba(0,0,0,.30);padding:30px 40px 34px}
.ctitle{display:flex;align-items:center;gap:16px}
.ctitle svg{width:46px;height:46px;fill:#D97757;flex:none}
.cw{font-family:var(--serif);font-size:42px;letter-spacing:-.5px}
.pro{margin-left:auto;font:600 25px var(--sans);color:#B9B5AE;border:2px solid #3A3A38;border-radius:999px;padding:9px 20px}
.hr{height:2px;background:#2A2A28;margin:22px 0 0}
.body{display:flex;align-items:stretch;margin-top:22px}
.left{flex:1}
.lab{font:600 22px var(--mono);letter-spacing:2px;color:#8F8B84}
.price{display:flex;align-items:baseline;gap:14px;margin-top:6px}
.pnum{font:800 196px var(--sans);letter-spacing:-10px;line-height:.92}
.pm{font:600 36px var(--sans);color:#A9A59E}
.free{align-self:center;margin-left:auto;font:800 25px var(--mono);letter-spacing:1px;color:#0D1F12;background:var(--green);border-radius:999px;padding:10px 20px}
.checks{width:330px;flex:none;border-left:2px solid #2A2A28;padding-left:28px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.ck{display:flex;align-items:center;gap:14px;font:600 27px var(--sans);color:#E8E5DE}
.ck svg{width:34px;height:34px;flex:none}
.sub{font:600 21px var(--mono);letter-spacing:1px;color:#7E7A73;margin-top:2px}

.stk{position:absolute;left:0;right:0;margin:auto;width:max-content;top:1292px;font:800 40px var(--sans);letter-spacing:-.5px;background:var(--clay);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px 30px;box-shadow:7px 7px 0 var(--ink)}
.cta{position:absolute;left:0;right:0;margin:auto;width:max-content;top:1418px;font:800 27px var(--mono);letter-spacing:1px;color:#0D1F12;background:#1E1E1D;color:#E9F7EE;border-radius:999px;padding:18px 34px;display:flex;align-items:center;gap:14px}
.cta b{color:#7FE0A6;font-weight:800}
.handle{position:absolute;left:0;width:1080px;top:1512px;text-align:center;font:600 25px var(--mono);color:var(--mute);letter-spacing:2px}
</style></head>
